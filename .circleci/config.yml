version: 2.1

orbs:
  docker: circleci/docker@3.0.1

workflows:
  version: 2
  build_pipeline:
    jobs:
      - docker/publish:
          image: yehonatancohen/parties247-auto
          tag: latest
          platform: linux/arm64
          use_buildkit: true
          login_server: https://index.docker.io/v1/
          docker_username: $DOCKERHUB_USERNAME
          docker_password: $DOCKERHUB_PASSWORD
          filters:
            branches:
              only: master